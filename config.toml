# Настройки лаунчера Wizards MC.
#
# Этот файл лежит в корне GitHub-репозитория сервера. Перед каждым запуском игры
# лаунчер проверяет репозиторий и, если файл изменился, скачивает новую версию.
# Копия в проекте лаунчера вшивается в exe: она действует, пока репозиторий
# недоступен, и из неё лаунчер берёт адрес репозитория.

[repository]
# Адрес репозитория берётся только из копии, вшитой в лаунчер: чтобы сменить
# репозиторий, нужна новая сборка лаунчера.
name = "alex-listochek/wizards-server-mods" # "владелец/репозиторий" (публичный), пусто — без репозитория
# Обязательные моды сервера: все .jar из этой папки репозитория лаунчер держит
# в game/server-mods и обновляет вместе с репозиторием. Моды игрока в game/mods
# не затрагиваются. Работает только с ядром fabric.
mods = ""                 # папка с модами в репозитории, пусто — корень

[game]
version = "26.2"          # версия Minecraft
loader = "fabric"         # ядро: vanilla, fabric, quilt, forge, neoforge
loader_version = "latest" # версия ядра, "latest" — самая новая стабильная
dir = "game"              # папка игры: путь от папки лаунчера или абсолютный
server = "wizards.ru-mc.ru:25603" # "адрес:порт" сервера, куда игра зайдёт сразу после загрузки; пусто — главное меню

[java]
path = "auto"             # "auto" — скачать подходящую Java, или путь к java
ram_min = "1G"
ram_max = "4G"
# UseCompactObjectHeaders экономит память, но работает только на Java 25+
# (Minecraft 26.1 и новее). Для более старых версий уберите этот флаг.
args = [
  "-XX:+UseG1GC",
  "-XX:MaxGCPauseMillis=50",
  "-XX:+ParallelRefProcEnabled",
  "-XX:+DisableExplicitGC",
  "-XX:+UseCompactObjectHeaders",
]

[window]
width = 1280
height = 720
fullscreen = true

# Настройки самой игры (game/options.txt), которые лаунчер выставляет перед
# каждым запуском. Остальные настройки игрок меняет в игре как обычно.
# Названия ключей и значения такие же, как в options.txt.
[options]
lang = "ru_ru"                 # язык игры
onboardAccessibility = false   # без экрана специальных возможностей при первом запуске
skipMultiplayerWarning = true  # без предупреждения перед сетевой игрой
tutorialStep = "none"          # без подсказок для новичков
